<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reproductor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      background: black;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="player" allowfullscreen></iframe>

  <script>
    const params = new URLSearchParams(window.location.search);
    const videoUrl = params.get("url");

    if (videoUrl) {
      document.getElementById("player").src = decodeURIComponent(videoUrl);
    } else {
      document.body.innerHTML = "<h1 style='color: white; text-align: center; padding: 20px;'>No se proporcionó ningún video</h1>";
    }
  </script>
</body>
</html>
